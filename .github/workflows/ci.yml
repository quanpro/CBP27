name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Privacy guard (every tracked file)
        run: node tools/check_no_private.mjs --all

      - name: Backend tests (pure logic + API on the harness)
        run: npm run test:backend

      - name: Seed.gs is generated from docs/data/courses.json
        run: node tools/gen_seed.mjs --check

      - name: backend/dist is up to date
        run: node tools/bundle_backend.mjs --check

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (mock + real projects)
        run: npm run test:e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/.tmp/report
            tests/.tmp/results
          retention-days: 14
